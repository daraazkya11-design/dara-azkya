<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>02 - Form Login - Sebelum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            background-color: lightgray;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button[type="submit"] {
            width: 100%;
            background-color:#3498db;
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }
        button[type="submit"]:hover {
            background-color:#0056b3;
        }       

    </style>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN (TO-DO LIST):
    1. Atur body agar form berada di tengah layar (Flexbox, min-height 100vh).
    2. Berikan gaya pada kontainer ".login-container" (background putih, padding 30px, border-radius 8px, box-shadow).
    3. Atur label agar display-nya 'block' dan memiliki margin-bottom agar input ada di bawahnya.
    4. Atur input text dan password agar lebarnya 100% (width: 100%), padding 10px, margin-bottom 15px, border 1px solid #ccc, dan border-radius 5px.
    5. Tambahkan pseudo-class :focus pada input (ubah warna border menjadi biru dan outline: none saat diklik).
    6. Atur tombol submit (lebar 100%, background warna, warna teks putih, padding, border-radius, cursor: pointer, border: none).
    7. Tambahkan efek hover pada tombol submit.
    -->
    <div class="login-container">
        <h2>Masuk ke Akun</h2>
        <form>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email">
            
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password">
            
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
