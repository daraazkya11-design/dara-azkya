<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>09 - Testimoni - Sebelum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            padding: 20px;
        }
        .testimonial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .card::before {
            content: '"';
            font-size: 100px;
            color: rgba(0, 0, 0, 0.05);
            position: absolute;
            top: -20px;
            left: -10px;
            z-index: -1;
        }
        .author {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }
        .author h4 {
            margin-right: 10px;
        }
        .author span {
            color: gray;
        }
    </style>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Atur container ".testimonial-grid" menggunakan CSS Grid. Gunakan grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)) dan beri gap.
    2. Berikan gaya pada kartu (background, padding, border-radius, shadow ringan).
    3. Buat posisi kartu menjadi "position: relative". 
    4. Gunakan pseudo-element "::before" pada kartu untuk menambahkan karakter tanda kutip besar (content: '"') di pojok kiri atas sebagai watermark (ukuran sangat besar, warna sangat pudar, z-index rendah).
    5. Rapikan elemen gambar profil dan nama (bisa menggunakan flexbox untuk menjejerkannya secara horizontal).
    -->
    <div class="testimonial-grid">
        <div class="card">
            <p>"Pelayanan luar biasa, website saya jadi lebih cepat dan menarik."</p>
            <div class="author">
                <h4>Andi Wijaya</h4>
                <span>CEO StartupX</span>
            </div>
        </div>
        <div class="card">
            <p>"Sangat mudah diajak komunikasi dan hasilnya di luar ekspektasi."</p>
            <div class="author">
                <h4>Siti Aminah</h4>
                <span>Pemilik Toko Online</span>
            </div>
        </div>
        <div class="card">
            <p>"Kualitas kode sangat bersih, mudah dilanjutkan oleh tim internal kami."</p>
            <div class="author">
                <h4>Reza Pratama</h4>
                <span>CTO TechIndo</span>
            </div>
        </div>
    </div>
</body>
</html>
